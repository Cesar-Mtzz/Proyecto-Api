<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="author" content="">
        <meta name="description" content="">
        <meta name="viewport" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="shortcut icon" href="./icons/f1.svg" type="image/svg">
        <title>F1 Dashboard</title>
        <link rel = "stylesheet" href="./css/style.css">
        <link rel = "stylesheet" href="./css/login.css">
        <script src="./js/paginas/login.js"></script>
    </head>
    <body>
        <form id="form">
            <h1 class="titulo">Inciar Sesion</h1>
            <div class="input">
                <label>Usuario:</label>
                <input type="text" id="inputUser" placeholder="Ingrese su usuario" required>
            </div>
            <div class="input">
                <label>Contraseña:</label>
                <input type="password" id="inputPass" placeholder="Ingrese su contraseña" required>
            </div>
            <p id="errorMsg">Credenciales inválidas</p>
            <button type="submit" class="btn btn-dark w-100 fw-bold">Ingresar</button>
            <p>¿No tienes cuenta?, <a href="./html/registro.html">crea una aqui</a></p>
        </form>

        <script>
            document.addEventListener('DOMContentLoaded', saltarLoginSiAutenticado);
            
            document.getElementById('form').addEventListener('submit', iniciarSesion);
        </script>
    </body>
</html>
