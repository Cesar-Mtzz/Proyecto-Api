<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="author" content="">
        <meta name="description" content="">
        <meta name="viewport" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="shortcut icon" href="../icons/f1.svg" type="image/svg">
        <title>F1 Dashboard</title>
        <link rel = "stylesheet" href="../css/style.css">
        <link rel = "stylesheet" href="../css/login.css">
        <script src="../js/paginas/login.js"></script>
    </head>
    <body>
        <form id="form">
            <h1 class="titulo">Registro</h1>
            <div class="input">
                <label>Nombre:</label>
                <input type="text" id="inputName" placeholder="Ingrese su nombre" required>
            </div>
            <div class="input">
                <label>Apellidos:</label>
                <input type="text" id="inputLastname" placeholder="Ingrese sus apellidos" required>
            </div>
            <div class="input">
                <label>Usuario:</label>
                <input type="text" id="inputUser" placeholder="Ingrese su usuario" required>
            </div>
            <div class="input">
                <label>Contraseña:</label>
                <input type="password" id="inputPass" placeholder="Ingrese su contraseña" required>
            </div>
            <div class="input" id="inCheckbox">
                <label>¿Quiere mostrar solo la informacion mas importante?</label>
                <input type="checkbox" id="inputCheck">
            </div>
            <p id="errorMsg">Credenciales inválidas</p>
            <button type="submit" class="btn btn-dark w-100 fw-bold">Ingresar</button>
            <p>¿Ya tienes cuenta?, <a ../index.html>inicia sesion aqui</a></p>
        </form>

        <script>
            document.getElementById('form').addEventListener('submit', crearUsuario);
        </script>
    </body>
</html>
